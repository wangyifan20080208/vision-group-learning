# RMUL 2027 场地定义（占位版，等真实图纸替换）
# 单位：米。x 向右，y 向上，原点在场地中心。
# 改完重跑：bash /mnt/d/dshworkspace/rm_nav_sim/install_sim.sh

resolution: 0.05

bounds:
  x: [-7.5, 7.5]
  y: [-4.0, 4.0]
margin: 0.6

walls:
  # 外墙
  - [-7.5, -4.0,  7.5, -4.0, 0.20]
  - [-7.5,  4.0,  7.5,  4.0, 0.20]
  - [-7.5, -4.0, -7.5,  4.0, 0.20]
  - [ 7.5, -4.0,  7.5,  4.0, 0.20]
  # 中央高地围栏（留四个通道口）
  - [-2.0, -1.2, -0.6, -1.2, 0.15]
  - [ 0.6, -1.2,  2.0, -1.2, 0.15]
  - [-2.0,  1.2, -0.6,  1.2, 0.15]
  - [ 0.6,  1.2,  2.0,  1.2, 0.15]
  - [-2.0, -1.2, -2.0, -0.6, 0.15]
  - [-2.0,  0.6, -2.0,  1.2, 0.15]
  - [ 2.0, -1.2,  2.0, -0.6, 0.15]
  - [ 2.0,  0.6,  2.0,  1.2, 0.15]

props:
  # 中央高地
  - {type: box, x: 0.0, y: 0.0, w: 1.2, h: 1.2, yaw_deg: 0}
  # 四角立柱
  - {type: box, x: 5.6, y: 2.8, w: 0.8, h: 0.8, yaw_deg: 0}
  - {type: box, x: -5.6, y: 2.8, w: 0.8, h: 0.8, yaw_deg: 0}
  - {type: box, x: 5.6, y: -2.8, w: 0.8, h: 0.8, yaw_deg: 0}
  - {type: box, x: -5.6, y: -2.8, w: 0.8, h: 0.8, yaw_deg: 0}
  # 两侧长挡板（给雷达特征）
  - {type: box, x: 4.0, y: 3.4, w: 2.6, h: 0.30, yaw_deg: 0}
  - {type: box, x: -4.0, y: 3.4, w: 2.6, h: 0.30, yaw_deg: 0}
  - {type: box, x: 4.0, y: -3.4, w: 2.6, h: 0.30, yaw_deg: 0}
  - {type: box, x: -4.0, y: -3.4, w: 2.6, h: 0.30, yaw_deg: 0}
  # 斜置挡块（打破对称性，帮 AMCL 收敛；放远一点，避免形成窄缝）
  - {type: box, x: -4.6, y: 0.6, w: 0.9, h: 0.30, yaw_deg: 35}
  - {type: box, x: 4.6, y: -0.6, w: 0.9, h: 0.30, yaw_deg: -35}
